# @bugsee/bugsee-cli's postinstall downloads the prebuilt Rust `bugsee-cli` binary the bundler
# plugins (@bugsee/vite-plugin -> @bugsee/bundler-plugin-core) spawn for the source-map/debug-id
# upload step. This is its own pnpm workspace root (new-sample.mjs), so the root allowBuilds list
# does not apply here — repeat it.
allowBuilds:
  '@bugsee/bugsee-cli': true
  esbuild: true
