<div class="app-shell">
  <nav class="app-nav">
    <h1>Bugsee Expenses</h1>
    <a routerLink="/expenses" routerLinkActive="active">Expenses</a>
    <a routerLink="/expenses/new" routerLinkActive="active">New expense</a>
    <a routerLink="/approvals" routerLinkActive="active">Approvals</a>
    <a routerLink="/settings" routerLinkActive="active">Settings</a>
    <a routerLink="/scenarios" routerLinkActive="active">Scenarios</a>
    <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px;">
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input
          type="checkbox"
          data-testid="manager-toggle"
          [checked]="manager()"
          (change)="toggleManager()"
        />
        Manager mode
      </label>
    </div>
  </nav>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
