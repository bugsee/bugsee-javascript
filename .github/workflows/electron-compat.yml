name: Electron compat (non-blocking)

# Early-warning lane for upcoming Electron majors (issue #116). It runs the REAL-Electron smoke
# (packages/instrumentation-tests/harness/electron-smoke.mts: real launchMain + launchRenderer in a
# `sandbox: true` window) against a chosen Electron dist-tag.
#
# NON-BLOCKING BY DESIGN: it only triggers on a schedule and by hand, never on push / pull_request, so it can
# never be a required check on a PR. The job also sets `continue-on-error`, so a red alpha shows up as a
# visible failed run on the Actions tab without poisoning anything that aggregates run conclusions.
# The repo has no Electron dependency on purpose; the binary is installed into a scratch dir.

on:
  push:
    branches: [fix/issue-116] # TEMP: verify the lane on a real runner before merge; removed afterwards
  schedule:
    - cron: '17 4 * * *' # nightly
  workflow_dispatch:
    inputs:
      electron:
        description: 'Electron version or dist-tag to test (npm), e.g. alpha, latest, 46.0.0-alpha.1'
        default: alpha
        required: false

permissions:
  contents: read

concurrency:
  group: electron-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real Electron smoke (${{ inputs.electron || 'alpha' }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one network use: fetching the Electron binary (postinstall) into a scratch dir outside the repo.
      - name: Install Electron
        env:
          ELECTRON_SPEC: ${{ inputs.electron || 'alpha' }}
        run: |
          mkdir -p "$RUNNER_TEMP/electron"
          cd "$RUNNER_TEMP/electron"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "electron@${ELECTRON_SPEC}"
          node -e "process.stdout.write('ELECTRON_BIN=' + require('electron') + '\n')" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      # Chromium needs libs the runner image may lack; xvfb gives it a display for the (hidden) window.
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6

      - name: Real-Electron smoke
        run: xvfb-run -a pnpm --filter @bugsee/instrumentation-tests test:electron-smoke
