version: 2
updates:
  # Workflow actions run with repository credentials; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Runtime dependencies of the published packages. Dev tooling churns too much to review weekly; its
  # security fixes still arrive through Dependabot security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors of the things we TEST AGAINST are a compatibility decision, not a routine bump: each one
    # needs the adapter, its declared peer range and its e2e harness updated together (see the daily
    # compat-watch issue). `@types/node` is held at the oldest Node we build on: its typings decide
    # which APIs shared code may call, and the SDK supports Node >= 18.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: 'preact'
        update-types: ['version-update:semver-major']
